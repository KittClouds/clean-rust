[workspace]
resolver = "2"
members = [
    "crates/northstar-rl-core",
    "crates/northstar-rl-broker",
    "crates/northstar-rl-campaign",
    "crates/northstar-alpha-factory",
    "crates/northstar-rl-cli",
    "crates/northstar-rl-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
blake3 = "1.8"
bytemuck = { version = "1.23", features = ["derive"] }
hashbrown = { version = "0.16", features = ["serde"] }
memchr = "2.7"
memmap2 = "0.9"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "3.1", features = ["json"] }
zeroize = "1.8"
wide = "0.7"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
