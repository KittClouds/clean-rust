[package]
name = "kammi-ledgerd"
version = "0.1.0"
description = "Kammi Library daemon: /v1 HTTP surface over kammi-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
futures-util = "0.3"
http-body-util = "0.1"
kammi-core.workspace = true
kammi-embed.workspace = true
kammi-jcs.workspace = true
kammi-store.workspace = true
parking_lot = "0.12"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
