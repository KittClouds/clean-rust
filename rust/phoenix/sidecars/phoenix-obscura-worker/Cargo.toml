[package]
name = "phoenix-obscura-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
obscura = { git = "https://github.com/h4ckf0r0day/obscura", rev = "b2e4bb49a7723619527fd0cbb9f2c2acbc58f851" }
obscura-browser = { git = "https://github.com/h4ckf0r0day/obscura", rev = "b2e4bb49a7723619527fd0cbb9f2c2acbc58f851" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
