[workspace]
resolver = "2"
members = [
    "crates/northstar-auction-contract",
    "crates/northstar-mt5-corpus",
    "crates/northstar-auction-replay",
    "crates/northstar-parity-fixtures",
    "crates/northstar-parity-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
hashbrown = { version = "0.15", features = ["serde"] }
memchr = "2.7"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
