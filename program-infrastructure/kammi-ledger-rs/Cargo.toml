[workspace]
resolver = "2"
members = ["crates/kammi-jcs", "crates/kammi-v1", "crates/kammi-store", "crates/kammi-migrate", "crates/kammi-projector", "crates/kammi-core", "crates/kammi-ledgerd", "crates/kammi-embed", "crates/kammi-contract", "crates/kammi-shell"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
kammi-jcs = { path = "crates/kammi-jcs" }
kammi-v1 = { path = "crates/kammi-v1" }
kammi-store = { path = "crates/kammi-store" }
kammi-core = { path = "crates/kammi-core" }
kammi-embed = { path = "crates/kammi-embed" }
bytemuck = { version = "1.21", features = ["derive"] }
memmap2 = "0.9"
hashbrown = "0.15"
proptest = "1.6"
# Never enable serde_json's `arbitrary_precision`: feature unification would change Number
# semantics under kammi-jcs and break identity reproduction.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = 1
