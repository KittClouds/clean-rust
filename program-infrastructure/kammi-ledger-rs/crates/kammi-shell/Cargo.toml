[package]
name = "kammi-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The kammi shell: CLI and MCP over the Library's HTTP API (amendment v4 shell ABI)"

[[bin]]
name = "kammi"
path = "src/bin/kammi.rs"

[[bin]]
name = "kammi-mcp"
path = "src/bin/kammi-mcp.rs"

[dependencies]
kammi-contract = { path = "../kammi-contract" }
kammi-jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "2.12", default-features = false }
