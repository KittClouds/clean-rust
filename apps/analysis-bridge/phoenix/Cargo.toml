[workspace]
members = [
    "crates/phoenix-analysis-bridge",
    "crates/phoenix-alex",
    "crates/phoenix-chunker",
    "crates/phoenix-dynamic-ner",
    "crates/phoenix-document-index",
    "crates/phoenix-discovery-view",
    "crates/phoenix-embed",
    "crates/phoenix-graph",
    "crates/phoenix-graph-kernel",
    "crates/phoenix-hyperbolic",
    "crates/phoenix-rel-post",
    "crates/phoenix-scope-analysis",
    "crates/phoenix-store-native-core",
    "crates/phoenix-store-overgraph",
    "crates/phoenix-semantic-v2",
    "crates/phoenix-types",
    "crates/phoenix-kernel",
]
default-members = [
    "crates/phoenix-graph-kernel",
    "crates/phoenix-hyperbolic",
    "crates/phoenix-rel-post",
    "crates/phoenix-scope-analysis",
    "crates/phoenix-semantic-v2",
    "crates/phoenix-store-native-core",
    "crates/phoenix-store-overgraph",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["KittClouds"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itoa = "1.0"
daachorse = "=0.4.1"
bincode = "1.3"
rmp-serde = "1.3"
fst = "0.4"
roaring = "0.10"
heed3 = "0.22"
thiserror = "1.0"
lz4_flex = "0.11"
smallvec = { version = "1.15", features = ["serde"] }
rustc-hash = "1.1"
rustling = { version = "0.8.0", default-features = false, features = ["parallel"] }
zerocopy = { version = "0.7", features = ["derive"] }
memchr = "2.7"
memmap2 = "0.9"
wide = "0.7.33"
stop-words = "0.9"
openrouter-rs = "0.4.7"
compact_str = { version = "0.8", features = ["serde"] }
slotmap = { version = "1.0", features = ["serde"] }
hashbrown = "0.15"
nohash-hasher = "0.2"
rowan = "0.16"
aho-corasick = "1.1"
regex-automata = "0.4"
bstr = "1.11"
arc-swap = "1.7"
overgraph = "0.4.1"
bm25_turbo = "0.2.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
esaxx-rs = { path = "../phoenix-gliner-smoke/vendor/esaxx-rs" }
scirs2-text = { path = "vendor/scirs2-text" }
