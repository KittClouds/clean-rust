[package]
name = "rdc-experiment-002"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rdc-experiment-001 = { path = "baseline/rdc-experiment-001" }
blake3 = "=1.8.5"
hashbrown = "=0.17.1"
memchr = "=2.8.3"
memmap2 = "=0.9.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zerocopy = { version = "=0.8.55", features = ["derive"] }

[[bin]]
name = "rdc002-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "rdc002-bench"
path = "src/bin/bench.rs"
