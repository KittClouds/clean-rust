[package]
name = "q10-wedge-correlates"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
anyhow = "1.0"
hashbrown = "0.16"
memchr = "2.8"
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
wide = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
