[package]
name = "fly-pheno-00-v0-2-qcomp-executor"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
csv = "1.3"
memchr = "2.8"
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
wide = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
