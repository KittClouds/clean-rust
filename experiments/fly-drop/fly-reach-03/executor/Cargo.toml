[package]
name = "fly-reach-03-executor"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
hashbrown = "0.15"
memchr = "2.8"
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
wide = "0.7"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
