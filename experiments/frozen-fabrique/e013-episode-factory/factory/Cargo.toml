[package]
name = "e013-episode-factory"
version = "0.1.0"
edition = "2021"
publish = false
description = "Core construction and audit primitives for E013 local-commit episodes"

[lib]
name = "e013_episode_factory"
path = "src/lib.rs"

[[bin]]
name = "e013-factory"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hashbrown = "0.15"
memchr = "2.7"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tempfile = "3.13"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "seal_hash"
harness = false
