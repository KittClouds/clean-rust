[package]
name = "fas-e4-support-plan-v05"
version = "0.1.0"
edition = "2024"

[dependencies]
hashbrown = "0.15"
memchr = "2.7"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"




