[package]
name = "phoenix-gliner25-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
gliner25-rs = { git = "https://github.com/dariofinardi/gliner25-rs.git", rev = "a639bad1ee744a7884deea2bd01512fddd886b8d" }
hashbrown = "0.16"
memchr = "2.7"
memmap2 = "0.9"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smallvec = "1.15"
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
