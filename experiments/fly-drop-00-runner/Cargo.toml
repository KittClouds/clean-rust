[package]
name = "fly-drop-00-runner"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
bytemuck = "1.25"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wide = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
