[package]
name = "f4-binding-01-stage-b-native-collector"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
memchr = "2.8"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
wide = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
