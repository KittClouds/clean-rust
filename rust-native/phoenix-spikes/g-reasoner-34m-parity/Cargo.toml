[package]
name = "g-reasoner-34m-parity"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
qwen = ["dep:candle-transformers", "dep:tokenizers"]
qwen-onnx = ["dep:ort", "dep:ort-sys", "dep:tokenizers"]

[dependencies]
blake3 = "1.8"
bytemuck = { version = "1.23", features = ["derive"] }
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = { version = "0.11.0", optional = true }
hashbrown = { version = "0.15", features = ["serde"] }
memchr = "2.7"
memmap2 = "0.9"
phoenix-model-hot-cache = { path = "../phoenix-model-hot-cache" }
rayon = "1.12"
safetensors = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }
wide = "0.7.33"
zerocopy = { version = "0.7", features = ["derive"] }

ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
ort-sys = { version = "=2.0.0-rc.9", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.20"

[[bin]]
name = "g-reasoner-parity"
path = "src/bin/g_reasoner_parity.rs"
test = false

[[bin]]
name = "g-reasoner-perf"
path = "src/bin/g_reasoner_perf.rs"
test = false

[[bin]]
name = "g-reasoner-qwen-smoke"
path = "src/bin/g_reasoner_qwen_smoke.rs"
required-features = ["qwen"]
test = false

[[bin]]
name = "g-reasoner-qwen-onnx-smoke"
path = "src/bin/g_reasoner_qwen_onnx_smoke.rs"
required-features = ["qwen-onnx"]
test = false

[[bin]]
name = "g-reasoner-qwen-backend-parity"
path = "src/bin/g_reasoner_qwen_backend_parity.rs"
required-features = ["qwen", "qwen-onnx"]
test = false
