[package]
name = "phoenix-candle-baseline-trainer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1.8"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
compact_str = { version = "0.8", features = ["serde"] }
phoenix-graph-research = { path = "../../phoenix/crates/phoenix-graph-research", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.24"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[[bin]]
name = "candle-baseline-trainer"
path = "src/main.rs"
