[package]
name = "phoenix-revision-inference"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
encoders = [
    "dep:ort",
    "gfm-rag-8m-parity/mpnet-onnx",
    "g-reasoner-34m-parity/qwen",
    "g-reasoner-34m-parity/qwen-onnx",
]
duel = ["encoders", "phoenix-revision-impact/gold-harness"]

[dependencies]
blake3 = "1.8"
bytemuck = { version = "1.23", features = ["derive"] }
candle-core = "0.11.0"
compact_str = { version = "0.8", features = ["serde"] }
g-reasoner-34m-parity = { path = "../g-reasoner-34m-parity" }
gfm-rag-8m-parity = { path = "../gfm-rag-8m-parity" }
hashbrown = "0.15"
memchr = "2.7"
memmap2 = "0.9"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"], optional = true }
phoenix-graph-rebuild = { path = "../../phoenix/crates/phoenix-graph-rebuild" }
phoenix-model-hot-cache = { path = "../phoenix-model-hot-cache" }
phoenix-revision-impact = { path = "../phoenix-revision-impact" }
phoenix-types = { path = "../../phoenix/crates/phoenix-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tempfile = "3.20"
thiserror = "2.0"
zerocopy = { version = "0.7", features = ["derive"] }

[patch.crates-io]
scirs2-text = { path = "../../phoenix/vendor/scirs2-text" }

[[bin]]
name = "phase6-authoritative-smoke"
path = "src/bin/phase6_authoritative_smoke.rs"
required-features = ["encoders"]

[[bin]]
name = "model-hot-cache-bench"
path = "src/bin/model_hot_cache_bench.rs"

[[bin]]
name = "revision-impact-model-duel"
path = "src/bin/revision_impact_model_duel.rs"
required-features = ["duel"]

[[bin]]
name = "revision-gold-review-packet"
path = "src/bin/revision_gold_review_packet.rs"
required-features = ["duel"]
