[package]
name = "phoenix-discovery-community"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
wgpu-shadow = ["dep:graph-analytics-wgpu-kernel"]

[dependencies]
blake3 = "1.8"
graph-analytics-wgpu-kernel = { path = "../../../phoenix-spikes/graph-analytics-wgpu-kernel", optional = true }
hashbrown.workspace = true
memmap2.workspace = true
phoenix-discovery-view = { path = "../phoenix-discovery-view" }
