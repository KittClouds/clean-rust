[package]
name = "phoenix-gliner25"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
blake3 = "1.8"
gliner25-rs = { git = "https://github.com/dariofinardi/gliner25-rs.git", rev = "a639bad1ee744a7884deea2bd01512fddd886b8d" }
memchr = "2.7"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
phoenix-gliner25-contract = { path = "../phoenix-gliner25-contract" }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
