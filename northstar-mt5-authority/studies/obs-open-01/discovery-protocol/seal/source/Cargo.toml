[package]
name = "obs-open-disc02p"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytemuck = { version = "1.23.2", features = ["derive"] }
hashbrown = { version = "0.15.5", features = ["serde"] }
memchr = "2.7.5"
memmap2 = "0.9.8"
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
wide = "0.7.33"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

