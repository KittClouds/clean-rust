<div class="relative flex h-full w-full overflow-hidden bg-[#05070b] text-zinc-100">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(34,211,238,0.08),transparent_24%),radial-gradient(circle_at_85%_12%,rgba(168,85,247,0.08),transparent_22%),linear-gradient(180deg,#05070b_0%,#06080e_50%,#05070b_100%)]">
    </div>

    <app-graph-entity-sidebar
        [entities]="entities()"
        [suggestions]="suggestions()"
        [selectedEntity]="activeEntity()"
        [linkCount]="atlasEdges().length"
        [lensMode]="graphLensMode()"
        [isScanning]="isScanningSuggestions()"
        [scanError]="suggestionError()"
        [contextId]="stewardContextId()"
        [searchText]="atlasSearch()"
        (entitySelected)="selectEntity($event)"
        (editEntityRequested)="editEntity($event)"
        (deleteEntityRequested)="deleteEntityFromSidebar($event)"
        (addEntityRequested)="openCreator()"
        (flushRequested)="flushRegistry()"
        (acceptSuggestionRequested)="acceptSuggestion($event)"
        (rejectSuggestionRequested)="rejectSuggestion($event)"
        (styleRequested)="toggleStyleDrawer()"
        (searchTextChange)="atlasSearch.set($event)"
        (lensModeChange)="graphLensMode.set($event)"
        (operatingRoomChange)="setOperatingRoom($event)">
    </app-graph-entity-sidebar>

    <main class="relative z-10 flex min-w-0 flex-1 flex-col">
        @if (selectedEntity()) {
        <header class="border-b border-white/5 bg-black/10 px-4 py-2 backdrop-blur-sm">
            <div class="flex min-h-10 flex-wrap items-center justify-between gap-3">
                <div class="flex min-w-0 flex-wrap items-center gap-2">
                    <span class="text-[10px] font-semibold uppercase tracking-[0.22em] text-cyan-200/80">Selected</span>
                    <h2 class="truncate text-xl font-semibold tracking-tight text-white">{{ selectedEntity()!.label }}</h2>
                    <span class="rounded-full border border-white/10 bg-white/[0.03] px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.16em]"
                        [style.color]="getColor(selectedEntity()!.kind)">
                        {{ selectedEntity()!.kind }}
                    </span>
                    <span class="rounded-full border border-white/10 bg-white/[0.03] px-2.5 py-1 text-[10px] uppercase tracking-[0.16em] text-zinc-400">
                        {{ selectedEntityConnectionCount() }} links
                    </span>
                </div>
                <button
                    type="button"
                    class="inline-flex shrink-0 items-center justify-center rounded-xl border border-cyan-400/20 bg-cyan-500/10 px-3 py-1.5 text-xs font-semibold text-cyan-50 transition hover:bg-cyan-500/15"
                    (click)="showAtlas()">
                    Atlas View
                </button>
            </div>
        </header>
        }

        <div class="graph-scroll min-h-0 flex-1 overflow-y-auto p-0">
            @if (!selectedEntity()) {
            <div class="h-full min-h-[560px] w-full">
                <app-graph-lens-workspace class="block h-full min-h-[560px]" [narrativeEntities]="entities()" [narrativeEdges]="atlasEdges()"
                    [lensMode]="graphLensMode()"
                    [operatingRoom]="operatingRoom()"
                    [atlasSearch]="atlasSearch()"
                    [isScanning]="isScanningSuggestions()"
                    [activeProvider]="activeSuggestionProvider()"
                    [candidateCount]="suggestions().length"
                    (entitySelected)="selectEntity($event)"
                    (addEntityRequested)="openCreator()"
                    (scanRequested)="runSuggestionScan('canvas', $event)"
                    (styleRequested)="toggleStyleDrawer($event)"
                    (atlasModeChange)="atlasMode.set($event)"
                    (atlasSearchChange)="atlasSearch.set($event)"
                    (lensModeChange)="graphLensMode.set($event)"></app-graph-lens-workspace>
            </div>
            } @else {
            <div class="mx-auto w-full max-w-6xl pb-8">
                <app-graph-detail [entity]="selectedEntity()!" (editRequested)="editEntity($event)"
                    (navigateRequested)="navigateToEntity($event)"></app-graph-detail>
            </div>
            }
        </div>
    </main>

    @if (isStyleDrawerOpen()) {
    <app-graph-style-drawer
        [initialKind]="styleTargetKind()"
        [initialGraphNodeKind]="styleTargetGraphNodeKind()"
        (close)="closeStyleDrawer()"></app-graph-style-drawer>
    }
</div>

<app-entity-creator-dialog [(visible)]="isCreatorOpen" [editEntity]="editingEntity()"
    (save)="onSaveEntity($event)"></app-entity-creator-dialog>
