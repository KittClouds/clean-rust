<div class="atlas-control-shell">
    <header class="atlas-control-header">
        <div>
            <span>Blueprint Hub</span>
            <h2>Atlas Control</h2>
        </div>
        <div class="atlas-control-ledger">
            @for (card of headerCards(); track card.id) {
            <span><strong>{{ card.valueLabel }}</strong> {{ card.label }}</span>
            }
        </div>
    </header>

    <section class="atlas-workflow-strip" aria-label="Atlas workflow status">
        @for (step of workflowSteps(); track step.id) {
        <article
            class="atlas-workflow-step"
            [class.atlas-workflow-ready]="step.tone === 'ready'"
            [class.atlas-workflow-review]="step.tone === 'review'"
            [class.atlas-workflow-warning]="step.tone === 'warning'"
            [class.atlas-workflow-quiet]="step.tone === 'quiet'">
            <span>{{ step.label }}</span>
            <strong>{{ step.value }}</strong>
            <small>{{ step.detail }}</small>
        </article>
        }
    </section>

    <main class="atlas-control-grid">
        <section class="atlas-control-pane atlas-control-index" aria-label="Atlas build controls">
            <app-search-panel class="atlas-control-panel-fill"></app-search-panel>
        </section>

        <section class="atlas-control-pane atlas-control-rooms" aria-label="Atlas operating rooms">
            <app-atlas-control-rooms
                class="atlas-control-panel-fill"
                [contract]="atlasControlContract()"
                [selectedRoomId]="selectedRoomId()"
                (roomChange)="setOperatingRoom($event)"
                (actionRequested)="dispatchRoomAction($event)">
            </app-atlas-control-rooms>
        </section>
    </main>
</div>

<app-entity-creator-dialog
    [(visible)]="isCreatorOpen"
    [editEntity]="editingEntity()"
    (save)="onSaveEntity($event)">
</app-entity-creator-dialog>
